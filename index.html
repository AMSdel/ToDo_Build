<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>guns.lol — Clone</title>
  <style>
    :root{
      --bg:#0a1a0a;
      --card:#102410;
      --accent:#4ade80; /* Grün */
      --text:#e6fbe6;
      --muted:#a1d9a1;
    }
    html,body{height:100%; margin:0;}
    body{
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(74, 222, 128, 0.05), transparent 8%),
                  linear-gradient(180deg, #051805 0%, #0a1f0a 100%);
      color:var(--text); display:flex; align-items:center; justify-content:center;
    }
    .card{
      width:360px; max-width:94%; padding:28px; border-radius:20px; background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      box-shadow: 0 8px 30px rgba(0,0,0,0.8); border:1px solid rgba(255,255,255,0.05);
      text-align:center;
      backdrop-filter: blur(8px);
    }
    h1{
      margin:0 0 18px 0; font-size:24px; font-weight:700; letter-spacing:0.6px; color:var(--accent);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    p.subtitle{margin:0 0 24px 0; color:var(--muted); font-size:14px}
    .buttons{display:flex; flex-direction:column; gap:14px}
    .btn{
      display:block; padding:14px 18px; border-radius:12px; text-decoration:none; font-weight:600;
      background: linear-gradient(135deg, rgba(74,222,128,0.15), rgba(34,197,94,0.05));
      border:1px solid rgba(74,222,128,0.4); color:var(--text);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .btn:hover{
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 25px rgba(74,222,128,0.3);
      background: linear-gradient(135deg, rgba(74,222,128,0.25), rgba(34,197,94,0.1));
    }
    .footer{margin-top:20px; font-size:12px; color:var(--muted)}
    @media (max-width:420px){ .card{padding:20px} h1{font-size:20px} }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Holy McDonalds</h1>
    <p class="subtitle">Willkommen — wähle einen Link</p>

    <nav class="buttons" aria-label="Links">
      <a class="btn" href="https://www.youtube.com/@Leonmosss" target="_blank" rel="noopener noreferrer">Leonmos Youtube</a>
      <a class="btn" href="https://github.com/AMSdel" target="_blank" rel="noopener noreferrer">Github</a>
      <a class="btn" href="https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1" target="_blank" rel="noopener noreferrer">Funny Thing</a>
    </nav>

    <div class="footer">Erstellt: guns.lol – moderne grüne Version</div>
  </main>
</body>
</html>
